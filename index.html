<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimì e Pepe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF6EA}
a{color:#B3202F}a:hover{color:#7A1420}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:5px solid #F28C28;outline-offset:3px}
button:disabled{cursor:default}
.bg-room{background-image:url(a/room_bg.jpg);background-size:cover;background-position:center 35%}
.th-map{background:linear-gradient(#CFEFFF,#F2FAFF)}.th-sky{background:linear-gradient(#8FD3FF,#E2F5FF)}.th-night{background:linear-gradient(#17153A,#4A3B8F)}.th-castle{background:linear-gradient(#F6D3EE,#FFF1E2)}.th-forest{background:linear-gradient(#A8DDB0,#E6F6D6)}.th-sea{background:linear-gradient(#6CC6F0,#C6EEFF)}.th-snow{background:linear-gradient(#BFDDF2,#F4FAFF)}
.fl-room{background:linear-gradient(180deg,#D8AE7C 0%,#E4BD8C 30%,#CFA06C 100%)}.fl-map{background:linear-gradient(#E6F4FF,#D4EAFA)}.fl-grass{background:linear-gradient(#A6DB82,#6FB85A)}.fl-night{background:linear-gradient(#2E2860,#1B1838)}.fl-sand{background:linear-gradient(#F6DFA8,#E3C07A)}.fl-snow{background:linear-gradient(#FFFFFF,#DDEBF6)}
.bg-wide{background-image:url(a/room_wide.jpg);background-size:cover;background-position:center 40%}
.pill{border:0;border-radius:999px;background:#FFFFFF;min-height:48px;min-width:48px;padding:6px 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:19px;font-weight:700;box-shadow:0 4px 0 rgba(58,36,24,.14)}
.card{border:0;border-radius:28px;background:#FFFFFF;padding:14px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:0 6px 0 rgba(58,36,24,.12);transition:transform .15s}
.card:active{transform:translateY(4px)}
.card img{pointer-events:none}
.who{border:0;border-radius:32px;padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 7px 0 rgba(58,36,24,.16);transition:transform .15s;min-height:200px;justify-content:center}
.who:active{transform:translateY(5px)}
.chip{border:0;border-radius:24px;background:#FFFFFF;min-height:64px;padding:8px 22px;display:inline-flex;align-items:center;gap:10px;font-size:clamp(19px,2.2vw,26px);font-weight:800;box-shadow:0 5px 0 rgba(58,36,24,.16)}
.chip:active{transform:translateY(3px)}
.chip.go{background:#D7263D;color:#FFFFFF}
.chip.ok{background:#2E8B57;color:#FFFFFF}
.item{position:absolute;border:0;background:transparent;padding:0;transform:translate(-50%,-100%);display:block}
.item img{width:100%;height:auto;display:block;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(58,36,24,.18))}
.item.tap img{filter:drop-shadow(0 0 10px rgba(255,214,90,.95)) drop-shadow(0 6px 6px rgba(58,36,24,.2))}
.item.hint img{animation:glow 1s ease-in-out infinite}
.item.gone{opacity:0;pointer-events:none}
.actor{position:absolute;transform:translate(-50%,-100%);pointer-events:none;display:flex;justify-content:center}
.actor img{height:100%;width:auto;display:block;filter:drop-shadow(0 10px 8px rgba(58,36,24,.25))}
.a-idle{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
.a-talk{animation:talk .5s ease-in-out infinite;transform-origin:50% 100%}
.a-walk{animation:bob .42s ease-in-out infinite;transform-origin:50% 100%}
.a-run{animation:bob .28s ease-in-out infinite;transform-origin:50% 100%}
.a-hop{animation:hop .6s ease-in-out infinite;transform-origin:50% 100%}
.a-dance{animation:dance .9s ease-in-out infinite;transform-origin:50% 100%}
.a-spin{animation:spin 1.1s ease-in-out infinite;transform-origin:50% 100%}
.a-shake{animation:shake .5s ease-in-out infinite;transform-origin:50% 100%}
.a-stretch{animation:stretch 1.4s ease-in-out infinite;transform-origin:50% 100%}
.a-wiggle{animation:wiggle .9s ease-in-out infinite;transform-origin:50% 100%}
.a-pop{animation:pop .5s ease-out both;transform-origin:50% 100%}
.a-float{animation:float 2.4s ease-in-out infinite;transform-origin:50% 100%}
.a-sleep{animation:breathe 4.5s ease-in-out infinite;transform-origin:50% 100%}
.frozen .a-dance,.frozen .a-hop,.frozen .a-spin,.frozen .a-shake,.frozen .a-stretch{animation-play-state:paused}
.burst{position:absolute;width:7%;pointer-events:none;animation:burst 1.4s ease-out both}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes talk{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-1.5%) rotate(-1deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5%) rotate(2deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.06,.92)}50%{transform:translateY(-22%) scale(.96,1.05)}}
@keyframes dance{0%,100%{transform:rotate(-7deg) translateY(0)}25%{transform:rotate(0) translateY(-8%)}50%{transform:rotate(7deg) translateY(0)}75%{transform:rotate(0) translateY(-8%)}}
@keyframes spin{0%{transform:scaleX(1)}25%{transform:scaleX(.1)}50%{transform:scaleX(-1)}75%{transform:scaleX(.1)}100%{transform:scaleX(1)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes stretch{0%,100%{transform:scale(1,1)}50%{transform:scale(.94,1.1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,190,40,.6))}50%{filter:drop-shadow(0 0 22px rgba(255,190,40,1))}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.2) rotate(0);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-260%) scale(1.1) rotate(160deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.a-idle,.a-talk,.a-walk,.a-run,.a-hop,.a-dance,.a-spin,.a-shake,.a-stretch,.a-wiggle,.a-float,.a-sleep,.item.hint img{animation:none}}
</style>
<style>
html,body{height:auto}
body{background:#FFF6EA;color:#3A2418}
#boot{min-height:60vh;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2','Trebuchet MS',sans-serif;font-size:24px;font-weight:700;color:#C41E30}
/* Telecomando / tastiera: focus sempre ben visibile */
.tv-keys #app button:focus,.tv-keys #app a:focus,.tv-keys #app summary:focus{outline:6px solid #F28C28 !important;outline-offset:4px;box-shadow:0 0 0 10px rgba(255,255,255,.92) !important}
.tv-keys #app .card:focus,.tv-keys #app .who:focus,.tv-keys #app .chip:focus{transform:scale(1.05);z-index:5}
.tv-keys #app .item:focus{outline-offset:2px;border-radius:16px;z-index:450 !important;background:rgba(255,255,255,.35)}
#app button:focus:not(:focus-visible){outline:none}
.tv-keys #app button:focus:not(:focus-visible){outline:6px solid #F28C28 !important}
html{scroll-padding:24px}
/* Schermi TV (orizzontali e larghi): meno scorrimento verticale */
@media (min-width:960px) and (min-aspect-ratio:16/10){
  [data-screen="start"] .bg-wide{aspect-ratio:16/5 !important;min-height:200px !important}
  [data-screen="start"] .who{min-height:150px !important;padding:12px !important}
  [data-screen="home"] .card img{height:92px !important}
  [data-screen="home"] h2{margin-top:2px !important}
  [data-screen="night"] .bg-wide{aspect-ratio:16/6 !important}
}
@media (prefers-reduced-motion: reduce){.tv-keys #app .card:focus,.tv-keys #app .who:focus,.tv-keys #app .chip:focus{transform:none}}
</style>
</head>
<body style="margin:0">
<div id="boot">Mimì e Pepe stanno arrivando…</div>
<div id="app"></div>
<script src="a/three.min.js"></script>
<script src="a/v/index.js"></script>
<script src="app.js"></script>
<script src="tv-nav.js"></script>
</body>
</html>
